name: Build Windows x64 (.NET 10)

on:
  push:
    branches: [ main, master, ci/windows-build ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/global.json

      - name: Publish (Native AOT, win-x64)
        run: >
          dotnet publish DuckDB.OlapExtension.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o ./publish/win-x64

      - name: List published files
        shell: pwsh
        run: |
          Get-ChildItem ./publish/win-x64 -Recurse | ForEach-Object {
            "{0,10:N2} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Replace((Get-Location).Path, '.')
          }

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: olap-extension-windows-x64
          path: |
            ./publish/win-x64/*.duckdb_extension
            ./publish/win-x64/*.dll
          if-no-files-found: error
          retention-days: 14