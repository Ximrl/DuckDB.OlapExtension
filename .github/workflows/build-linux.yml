name: Build Linux x64 (.NET 10)

on:
  push:
    branches: [ main, master, ci/linux-build ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read DuckDB version from csproj
        id: duckdb_version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content DuckDB.OlapExtension.csproj
          $version = ($csproj.Project.PropertyGroup |
                      ForEach-Object { $_.DuckDBVersion } |
                      Where-Object { $_ }) | Select-Object -First 1
          if (-not $version) {
            Write-Error "DuckDBVersion not found in DuckDB.OlapExtension.csproj"
            exit 1
          }
          Write-Host "DuckDB version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/global.json

      - name: Publish (Native AOT, linux-x64)
        run: >
          dotnet publish DuckDB.OlapExtension.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -o ./publish/linux-x64

      - name: List published files
        shell: pwsh
        run: |
          Get-ChildItem ./publish/linux-x64 |
            Select-Object Name, @{Name='Size (MB)'; Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Check shared library dependencies
        shell: pwsh
        working-directory: ./publish/linux-x64
        run: |
          Write-Host "=== ldd olap.duckdb_extension ==="
          ldd ./olap.duckdb_extension || true
          Write-Host ""
          Write-Host "=== Files in directory ==="
          Get-ChildItem

      - name: Download DuckDB CLI
        shell: pwsh
        run: |
          $version = "${{ steps.duckdb_version.outputs.version }}"
          $url = "https://github.com/duckdb/duckdb/releases/download/$version/duckdb_cli-linux-amd64.zip"
          Write-Host "Downloading DuckDB CLI $version from $url"
          Invoke-WebRequest -Uri $url -OutFile duckdb.zip
          Expand-Archive -Path duckdb.zip -DestinationPath ./publish/linux-x64 -Force
          chmod +x ./publish/linux-x64/duckdb
          ./publish/linux-x64/duckdb --version

      - name: Smoke test - extension loads
        shell: pwsh
        working-directory: ./publish/linux-x64
        run: |
          $env:LD_LIBRARY_PATH = "$($PWD.Path):$($env:LD_LIBRARY_PATH)"
          $output = ./duckdb -unsigned -csv -c "LOAD 'olap.duckdb_extension'; SELECT extension_name, loaded FROM duckdb_extensions() WHERE extension_name = 'olap';" 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'olap,true') {
            Write-Error "Extension did not load into DuckDB"
            exit 1
          }

      - name: Smoke test - ADOMD works inside AOT
        shell: pwsh
        working-directory: ./publish/linux-x64
        run: |
          $env:LD_LIBRARY_PATH = "$($PWD.Path):$($env:LD_LIBRARY_PATH)"
          $conn = "Data Source=dummy"
          $query = "LOAD 'olap.duckdb_extension'; SELECT olap_test_conn('$conn') AS result;"
          $output = ./duckdb -unsigned -csv -c $query 2>&1 | Out-String
          Write-Host $output

          if ($output -notmatch 'ADOMD OK') {
            Write-Error "Expected 'ADOMD OK' but got: $output"
            exit 1
          }

          $fatal = 'DllNotFoundException|TypeInitializationException|MissingMethodException|EntryPointNotFoundException'
          if ($output -match $fatal) {
            Write-Error "AOT or native dependency issue detected"
            exit 1
          }

          Write-Host "OK: ADOMD loaded and executed inside AOT binary"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: olap-extension-linux-x64
          path: |
            ./publish/linux-x64/*.duckdb_extension
            ./publish/linux-x64/*.so
          if-no-files-found: error
          retention-days: 14